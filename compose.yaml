# ============================================================
# DOCKER COMPOSE ДЛЯ ПРОДАКШЕНА
# ============================================================
# Запуск: docker-compose up -d
# Остановка: docker-compose down
# Просмотр логов: docker-compose logs -f
# ============================================================

services:
  # ============================================================
  # СЕРВИС: GO-ПРИЛОЖЕНИЕ (REST API)
  # ============================================================
  server:
    healthcheck:                    # проверка работы сервера через эндпоинт..http://localhost:${SERVER_PORT:-8087}/health
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8087}/health"]     
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    container_name: subscription-api                 # имя контейнера
    restart: unless-stopped                          # перезапускать, если не был вручную остановлен
    deploy:                           
      resources:
        limits:
          memory: 1G       
          cpus: '1.0'      
    environment:
      - ENV=docker                                   # переменная окружения для приложения Go (передаёт инфу, что Docker запущен)
      - LOG_PATH=/var/log/app/app.log                # переопределяет .env для работы сервера в доккере и записи логов в контейнере
    volumes:
      - ./logs:/var/log/app                          # монтирует и связывает папки на ПК logs и /var/log/app в контейнере (логи сохраняются локально)
      - /etc/localtime:/etc/localtime:ro             # синхронизация времени
      - /etc/timezone:/etc/timezone:ro
    build: .                                         # создание Docker-образа из Dockerfile в текущей папке
    env_file: 
      - .env                                         # берём данные окружения из файла .env на ПК
    ports:
     - "${SERVER_PORT:-8087}:${SERVER_PORT:-8087}"                                  # задаём порты
    depends_on:
      db:
        condition: service_healthy                    # контейнер server запустится только после того, как БД станет healthy
      redis:
        condition: service_healthy  
    networks:
      - app-network                                  # внутренняя сеть для общения с БД

  # ============================================================
  # СЕРВИС: POSTGRESQL (БАЗА ДАННЫХ)
  # ============================================================
  db:
    container_name: subscription-db                  # имя контейнера
    image: postgres:15-alpine                         # версия образа (лёгкая)
    restart: unless-stopped                          # перезапуск, пока вручную не остановлен
    deploy:
      resources:
        limits:
          memory: 1G      
          cpus: '1.0'     
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}      # пользователь БД (по умолчанию postgres)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # взять пароль из .env
      POSTGRES_DB: ${POSTGRES_DB}                    # взять имя БД из .env
    ports:
     - "${POSTGRES_PORT:-5432}:5432"                                   # пробросить порт взаимодействия БД с ПК в БД-жестко
    volumes:
      - postgres-db:/var/lib/postgresql/data         # связываем том postgres-db с папкой данных БД внутри контейнера (данные сохраняются на ПК, даже если контейнер удалён)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # проверка через pg_isready (ждём, пока БД ответит)
      interval: 10s                                  # проверять каждые 10 секунд (в продакшене реже, чтобы не грузить БД)
      timeout: 5s                                    # ждать ответа 5 секунд
      retries: 5                                     # 5 попыток (максимум 50 секунд)
    networks:
      - app-network                                  # внутренняя сеть для общения с сервером
  # ============================================================
  # СЕРВИС: grafana
  # ============================================================      
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
  # ============================================================
  # СЕРВИС: prometheus
  # ============================================================ 
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - app-network    
  # ============================================================
  # СЕРВИС: REDIS (КЕШ)
  # ============================================================
  redis:
    container_name: subscription-redis          # имя контейнера (для docker ps и docker exec)
    image: redis:7-alpine                       # официальный образ Redis на Alpine (маленький вес)
    restart: unless-stopped                     # перезапускать, если не был остановлен вручную
    deploy:                                     # ограничение ресурсов
      resources:
        limits:
          memory: 256M                          # максимум памяти для Redis
          cpus: '0.5'                           # максимум CPU (пол-ядра)
    ports:
      - "${REDIS_PORT:-6379}:6379"              # порт снаружи : порт внутри
    volumes:
      - redis-data:/data                        # сохраняем данные Redis на диске (том)
    networks:
      - app-network                             # общая сеть с сервером и БД
    healthcheck:                                # проверка работоспособности
      test: ["CMD", "redis-cli", "ping"]        # команда Ping (если ответит PONG — здоров)
      interval: 10s                             # проверять каждые 10 секунд
      timeout: 5s                               # ждать ответа до 5 секунд
      retries: 5                                # 5 попыток, после чего контейнер считается unhealthy
# ============================================================
# ОБЪЯВЛЕНИЕ ТОМОВ (хранилища данных)
# ============================================================ 
volumes:
  postgres-db:                       # именованный том для PostgreSQL на ПК (создаётся и управляется Docker)
  grafana-data:                      # именованный том для grafana на    ПК (создаётся и управляется Docker)
  redis-data:                        # именованный том для redis на      ПК (создаётся и управляется Docker)
  prometheus-data:                   # именованный том для prometheus на ПК (создаётся и управляется Docker)
# ============================================================
# ОБЪЯВЛЕНИЕ СЕТЕЙ (внутренняя изоляция контейнеров)
# ============================================================
networks:
  app-network:
    driver: bridge                                   # стандартная сеть между контейнерами (изолирует их от внешнего мира)

  