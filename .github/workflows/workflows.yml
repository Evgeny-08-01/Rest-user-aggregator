name: rest-user-agregator                
on:                                       # запуск по заливке кода в главную ветку
  #push:                                   # запуск по пушь 
   # branches:                             # запуск по любому пушув любую ветку
   # tags: [v*]                            # запуск по созданию тега (v1.0.0 и т. п.)
  #pull_request:
  #  branches: [main]
  push:              # Все пуши во все ветки
  pull_request:      # Все PR во все ветки
env:                                              
  DB_PATH: postgres://postgres:mysecret@localhost:5432/subscriptions?sslmode=disable
  LOG_LEVEL: info
  ENV: docker
  LOG_PATH: /var/log/app/app.log
  SERVER_PORT: 8080
jobs:
  lint:
    name: lint                            # проверка кода линтером
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          args: --timeout=5m   
  job1:
    name: test                            #проверять код на наличие ошибок и запускать тесты
    runs-on: ubuntu-latest                # Указываем окружение-виртуальная машина ubuntu-latest
    needs: lint                           # Ждём успешного линта
    services:          #  СЕРВИСЫ (Redis)
      redis:
        image: redis:7-alpine
        ports:
         - 6379:6379
        options: >-   # ← здесь, внутри redis
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5 
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mysecret
          POSTGRES_DB: subscriptions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: clone                       # Клонирование репозитория
        uses: actions/checkout@v4         # Этот шаг использует действие "actions/checkout@v4", которое проверит текущий код в репозитории
      - name: Set up Go                   # название для установки Go на виртуальную машину
        uses: actions/setup-go@v4         # Этот шаг использует действие "actions/setup-go@v4", которое установит Go в систему   
        with:                             # Для этого действия можно задать версию Go, которую надо установить   
          go-version: '1.23'    
      - name: Build                       # название
        run: go build -v ./...            # компиляция бинарника
      - name: Test                        #-название
        run: go test -v ./...             # запуск всех тестов
           
  job2:
    name: publish                              # при добавлении тегов должен автоматически публиковать приложение в DockerHub.
    runs-on: ubuntu-latest                     # Указываем окружение
    needs: job1                                # Задача test должна быть завершена до запуска publish
    if: startsWith(github.ref, 'refs/tags/')   # Проверка, что тег начинается с "refs/tags"
    steps:
      - name: Checkout                        # название
        uses: actions/checkout@v4             # Этот шаг использует действие "actions/checkout@v4", которое проверит текущий код в репозитории
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3  # Этот шаг использует действие "docker/setup-buildx-action@v3", которое устанавливает Docker Buildx
      - name: Log in to Docker Hub           # название
        uses: docker/login-action@v3         # Этот шаг использует действие "docker/login-action@v3", которое логинится в Docker Hub
        continue-on-error: false             # продолжать только если выполнилось без ошибок
        with:
          username: ${{ secrets.DOCKER_USERNAME }}         # Получение логина из секрета
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}     # Получение  пароля из секрета
          
      - name: Extract metadata (tags, labels) for Docker   # Этот шаг использует действие "docker/metadata-action@v5.5.1", которое извлекает метаданные для Docker
        id: meta                                           # Используется для получения выходных данных
        uses: docker/metadata-action@v5.5.1 #
        with: 
          images: evgenyvorobiev/rest-user-agregator  # Используется для указания имени Docker Hub-репозитория

      - name: Build and push Docker Image              # Этот шаг использует действие "docker/build-push-action@v5", которое строит и публикует Docker образ
        uses: docker/build-push-action@v5
        with: 
          context: .                                   # Используется для указания контекста сборки-здесь сборка из текущего репозитория
          push: true                                   # Используется для указания того, что нужно публиковать образ
          tags: ${{ steps.meta.outputs.tags }}         # Используется для указания тегов
          labels: ${{ steps.meta.outputs.labels }}     # Используется для указания метаданных
          platforms: linux/amd64,linux/arm64           # создание мультиплатформы 