<!DOCTYPE html>
<!-- 
    ============================================================
    1. ОБЪЯВЛЕНИЕ ТИПА ДОКУМЕНТА
    ============================================================
    <!DOCTYPE html> — говорит браузеру: "Это HTML5-документ".
    Без этой строки браузер может включить "старый" режим совместимости
    (Quirks Mode), из-за чего страница будет отображаться криво.
    Всегда пиши эту строку первой.
    ============================================================
-->
<html lang="ru">
<!-- 
    <html> — корневой элемент всей страницы.
    lang="ru" — указывает, что язык страницы русский.
    Это помогает браузеру, поисковикам и скринридерам (для незрячих).
-->

<head>
    <!-- 
        ============================================================
        2. СЛУЖЕБНАЯ ИНФОРМАЦИЯ (НЕ ВИДНА НА СТРАНИЦЕ)
        ============================================================
        <head> — содержит метаданные: настройки, стили, скрипты.
        Всё, что здесь написано, НЕ отображается на самой странице.
        ============================================================
    -->

    <!-- 
        2.1. КОДИРОВКА
        ============================================================
        <meta charset="UTF-8" /> — указывает, что текст в файле 
        закодирован в UTF-8. Это позволяет использовать русские буквы,
        иероглифы, эмодзи и спецсимволы.
        Без этой строки русский текст превратится в "кракозябры".
        ============================================================
    -->
    <meta charset="UTF-8" />

    <!-- 
        2.2. НАСТРОЙКА ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ
        ============================================================
        <meta name="viewport" ... > — управляет масштабом на телефонах.
        width=device-width  → ширина страницы = ширине экрана.
        initial-scale=1.0   → не увеличивать и не уменьшать масштаб при загрузке.
        Без этой строки страница на телефоне будет выглядеть как 
        уменьшенная копия с ПК (придётся зумить пальцами).
        ============================================================
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 
        2.3. ЗАГОЛОВОК ВКЛАДКИ
        ============================================================
        <title> — текст, который отображается на вкладке браузера.
        Это самый важный SEO-элемент (поисковики смотрят на него).
        ============================================================
    -->
    <title>📋 Управление подписками</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <!-- 
        2.4. ПОДКЛЮЧЕНИЕ СТИЛЕЙ (CSS)
        ============================================================
        <link rel="stylesheet" href="..." /> — подключает внешний файл со стилями.
        rel="stylesheet"   → говорит браузеру: "это таблица стилей".
        href="/css/style.css" → путь к файлу (относительно корня сайта).
        CSS отвечает за цвета, шрифты, отступы, тени, анимации.
        ============================================================
    -->
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <!-- 
        ============================================================
        3. ТЕЛО СТРАНИЦЫ (ВИДИМАЯ ЧАСТЬ)
        ============================================================
        <body> — всё, что здесь написано, отображается в браузере.
        ============================================================
    -->

    <!-- 
        3.1. ГЛАВНЫЙ КОНТЕЙНЕР
        ============================================================
        <div> — универсальный контейнер (блок) для группировки элементов.
        id="app" — уникальный идентификатор (используется в JS для поиска этого блока).
        class="container" — класс для стилизации (ограничивает ширину до 1200px и центрирует).
        ============================================================
    -->
    <div id="app" class="container">

        <!-- 
            ============================================================
            3.2. ШАПКА СТРАНИЦЫ (HEADER)
            ============================================================
            <header> — семантический тег для верхней части страницы.
            class="header" — класс для стилизации.
            ============================================================
        -->
        <header class="header">
            <!-- 
                <h1> — заголовок первого уровня (самый важный).
                Используется только один раз на странице.
                📋 — эмодзи (иконка), отображается как картинка.
            -->
            <h1>📋 Управление подписками</h1>

            <!-- 
                БЛОК ИНФОРМАЦИИ О ПОЛЬЗОВАТЕЛЕ
                class="user-info" — стилизует блок (flex, выравнивание).
            -->
            <div id="userInfo" class="user-info">

                <!-- 
                    <span> — строчный контейнер (не переносит на новую строку).
                    id="userNameDisplay" — сюда JavaScript вставит email пользователя.
                    Начальный текст "Гость" — временный, пока пользователь не вошёл.
                -->
                <span id="userNameDisplay">Гость</span>

                <!-- 
                    <span> с классом "badge" — стилизованный "ярлык" (метка).
                    id="userRoleDisplay" — сюда JS вставит роль: admin или user.
                -->
                <span id="userRoleDisplay" class="badge">user</span>

                <!-- 
                    КНОПКА ВЫХОДА
                    class="btn" — базовый стиль кнопки.
                    btn-outline — прозрачная с рамкой.
                    btn-sm — маленький размер.
                    id="logoutBtn" — по этому id JS вешает обработчик клика.
                -->
                <button id="logoutBtn" class="btn btn-outline btn-sm">Выйти</button>
            </div>
        </header>

        <!-- 
            ============================================================
            3.3. ФОРМА ВХОДА (показывается, если пользователь не авторизован)
            ============================================================
            class="card" — стиль "карточки" (белый фон, скруглённые углы, тень).
            id="loginForm" — JS показывает/скрывает эту форму.
        -->
        <div id="loginForm" class="card">
            <!-- <h3> — заголовок третьего уровня (меньше, чем h1) -->
            <h3>🔐 Вход</h3>

            <!-- 
                class="form-row" — flex-контейнер, который располагает поля в одну строку.
                Если не помещаются — переносит на следующую строку.
            -->
            <div class="form-row">

                <!-- 
                    ГРУППА ПОЛЯ: ЛОГИН
                    class="form-group" — объединяет label и input, выравнивает вертикально.
                -->
                <div class="form-group">
                    <!-- <label> — подпись над полем ввода. -->
                    <label>Логин</label>

                    <!-- 
                        <input> — поле ввода текста.
                        type="text" — обычный текст (не пароль).
                        id="loginUsername" — JS берёт значение из этого поля.
                        placeholder — подсказка внутри поля (исчезает при вводе).
                    -->
                    <input type="text" id="loginUsername" placeholder="admin или user" />
                </div>

                <!-- 
                    ГРУППА ПОЛЯ: ПАРОЛЬ
                -->
                <div class="form-group">
                    <label>Пароль</label>

                    <!-- 
                        type="password" — звёздочки вместо символов (скрывает пароль).
                    -->
                    <input type="password" id="loginPassword" placeholder="password" />
                </div>

                <!-- 
                    КНОПКА ВХОДА
                    class="btn btn-success" — зелёная кнопка (success = успех).
                -->
                <button id="loginBtn" class="btn btn-success">Войти</button>
            </div>

            <!-- 
                ПОДСКАЗКА С ТЕСТОВЫМИ ДАННЫМИ
                style="..." — CSS-стили прямо в теге (inline).
                margin-top:8px — отступ сверху.
                font-size:14px — размер шрифта.
                color:#6b7280 — серый цвет текста.
                <strong> — жирный шрифт.
            -->
            <div style="margin-top:8px;font-size:14px;color:#6b7280;">
                Тестовые аккаунты: <strong>admin</strong> / <strong>user</strong> (пароль такой же, как логин)
            </div>
        </div>

        <!-- 
            ============================================================
            3.4. ФОРМА РЕГИСТРАЦИИ (всегда видна)
            ============================================================
        -->
        <div id="registerForm" class="card">
            <h3>📝 Регистрация</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <!-- 
                        type="email" — браузер проверит, что введён email-адрес
                        (должна быть @ и точка).
                    -->
                    <input type="email" id="regEmail" placeholder="user@example.com" />
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" placeholder="******" />
                </div>
                <button id="registerBtn" class="btn btn-success">Зарегистрироваться</button>
            </div>
        </div>

        <!-- 
            ============================================================
            3.5. ОСНОВНОЙ ИНТЕРФЕЙС (показывается после входа)
            ============================================================
            style="display:none;" — этот блок скрыт по умолчанию.
            JavaScript покажет его (display:block) после успешного входа.
        -->
        <div id="mainApp" style="display:none;">

            <!-- 
                ============================================================
                3.5.1. ПАНЕЛЬ АДМИНА (кнопка "Управление шаблонами")
                ============================================================
                style="display:none;" — скрыта по умолчанию.
                JavaScript покажет её только если пользователь — админ.
            -->
            <div id="adminPanel" style="display:none; margin-bottom: 16px;">
                <!-- 
                    КНОПКА "УПРАВЛЕНИЕ ШАБЛОНАМИ"
                    id="manageTemplatesBtn" — по этому id JS вешает обработчик.
                    При клике — открывается страница управления шаблонами.
                -->
                <button id="manageTemplatesBtn" class="btn btn-success">📋 Управление шаблонами</button>
            </div>

            <!-- 
                ============================================================
                3.5.2. КАРТОЧКА СОЗДАНИЯ НОВОЙ ПОДПИСКИ
                ============================================================
            -->
            <div class="card">
                <h3>➕ Новая подписка</h3>

                <!-- 
                    <form> — тег для отправки данных на сервер.
                    id="createForm" — JS обрабатывает событие submit.
                    class="form-row" — поля в одну строку.
                -->
                <form id="createForm" class="form-row">

                    <!-- 
                        ПОЛЕ: ШАБЛОН (выпадающий список)
                        <select> — выпадающий список.
                        id="templateSelect" — JS будет заполнять его шаблонами из БД.
                        required — браузер не даст отправить форму, пока не выбран вариант.
                    -->
                    <div class="form-group">
                        <label>Шаблон</label>
                        <select id="templateSelect" required>
                            <!-- 
                                <option value=""> — пустой вариант (по умолчанию).
                                value="" — если оставить пустым, валидация не пройдёт.
                            -->
                            <option value="">Выберите шаблон</option>
                            <!-- 
                                Остальные <option> будут добавлены JavaScript-ом динамически,
                                когда он загрузит список шаблонов с сервера.
                            -->
                        </select>
                    </div>

                    <!-- ПОЛЕ: ДАТА НАЧАЛА -->
                    <div class="form-group">
                        <label>Дата начала</label>
                        <!-- 
                            type="text" — но ожидается формат MM-YYYY (например, 08-2026).
                            placeholder — подсказка формата.
                        -->
                        <input type="text" id="startDate" placeholder="MM-YYYY" required />
                    </div>

                    <!-- ПОЛЕ: ДАТА ОКОНЧАНИЯ -->
                    <div class="form-group">
                        <label>Дата окончания</label>
                        <!-- 
                            Не обязательное поле (можно оставить пустым = бессрочная подписка).
                        -->
                        <input type="text" id="endDate" placeholder="MM-YYYY (необяз.)" />
                    </div>

                    <!-- КНОПКА СОЗДАНИЯ -->
                    <button type="submit" class="btn btn-success">➕ Создать</button>

                    <!-- 
                        КНОПКА ОТМЕНЫ РЕДАКТИРОВАНИЯ
                        style="display:none;" — скрыта по умолчанию.
                        Появляется, когда пользователь редактирует существующую подписку.
                    -->
                    <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display:none;">Отмена</button>
                </form>
            </div>

            <!-- 
                ============================================================
                3.5.3. КАРТОЧКА РАСЧЁТА СУММАРНОЙ СТОИМОСТИ (TOTAL-COST)
                ============================================================
            -->
            <div class="card">
                <h3>💰 Суммарная стоимость за период</h3>
                <div class="form-row">

                    <!-- ПОЛЕ: ДАТА НАЧАЛА ПЕРИОДА -->
                    <div class="form-group">
                        <label>Дата начала (MM-YYYY)</label>
                        <input type="text" id="totalStartDate" placeholder="01-2025" />
                    </div>

                    <!-- ПОЛЕ: ДАТА ОКОНЧАНИЯ ПЕРИОДА -->
                    <div class="form-group">
                        <label>Дата окончания (MM-YYYY)</label>
                        <input type="text" id="totalEndDate" placeholder="12-2025" />
                    </div>

                    <!-- КНОПКА РАСЧЁТА -->
                    <button id="calcTotalBtn" class="btn">💰 Рассчитать</button>
                </div>

                <!-- 
                    БЛОК ДЛЯ ВЫВОДА РЕЗУЛЬТАТА
                    Сюда JS вставит сумму (например: "💰 Итого: 3400 ₽")
                    style="margin-top:12px;..." — отступ сверху, жирный шрифт.
                -->
                <div id="totalResult" style="margin-top:12px;font-size:18px;font-weight:bold;"></div>
            </div>
           
<!-- ============================================================
    3.5.3.5. КАРТОЧКА ФИЛЬТРОВ  ← ЭТОТ БЛОК ВСТАВЛЯЕМ СЮДА
    ============================================================ -->
    <!-- временно заблокировано 
<div class="card">
    <h3>🔍 Фильтрация</h3>
    <div class="form-row">
        <div class="form-group">
            <label>User ID</label>
            <input type="text" id="filterUserId" placeholder="фильтр по user_id" />
        </div>
        <div class="form-group">
            <label>Название сервиса</label>
            <input type="text" id="filterServiceName" placeholder="фильтр по названию" />
        </div>
        <button id="filterBtn" class="btn">🔍 Применить</button>
        <button id="clearFilterBtn" class="btn btn-outline">✖️ Сбросить</button>
    </div>
</div>     -->        
            <!-- 
                ============================================================
                3.5.4. КАРТОЧКА СО СПИСКОМ ПОДПИСОК
                ============================================================
            -->
            <div class="card">
                <!-- 
                    ЗАГОЛОВОК И КНОПКА ОБНОВЛЕНИЯ
                    style="display:flex;..." — flex-контейнер.
                    justify-content:space-between — раздвигает элементы по краям.
                    align-items:center — центрирует по вертикали.
                -->
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                    <h3>📋 Все подписки</h3>
                    <!-- КНОПКА ОБНОВЛЕНИЯ (перезагружает список) -->
                    <button id="refreshBtn" class="btn btn-outline">🔄 Обновить</button>
                </div>

                <!-- 
                    ВЫБОР КОЛИЧЕСТВА ЗАПИСЕЙ НА СТРАНИЦЕ (ПАГИНАЦИЯ)
                    style="display:flex;..." — flex-контейнер.
                    gap:12px — расстояние между элементами.
                -->
                <div style="display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap;">
                    <!-- <label> — подпись для выпадающего списка -->
                    <label for="pageSizeSelect" style="font-size:14px; font-weight:500;">Показывать:</label>

                    <!-- 
                        <select> — выпадающий список с вариантами: 5, 10, 25, 50, 100.
                        id="pageSizeSelect" — JS слушает изменения и обновляет таблицу.
                    -->
                    <select id="pageSizeSelect" style="padding:6px 12px; border-radius:8px; border:1px solid #d0d7de; font-size:14px; background:white; cursor:pointer;">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>

                    <!-- Пояснение к выпадающему списку -->
                    <span style="font-size:14px; color:#6b7280;">записей на странице</span>
                </div>

                <!-- 
                    КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ
                    id="listContainer" — сюда JS рендерит таблицу с подписками.
                    Начальный текст "Загрузка..." — временный.
                -->
                <div id="listContainer">Загрузка...</div>

                <!-- 
                    КОНТЕЙНЕР ДЛЯ ПАГИНАЦИИ (кнопки "Вперед/Назад")
                    id="paginationContainer" — JS вставляет сюда кнопки.
                    margin-top:12px — отступ сверху.
                -->
                <div id="paginationContainer" style="margin-top:12px;"></div>
            </div>

        </div> <!-- КОНЕЦ mainApp -->
    </div> <!-- КОНЕЦ container -->

    <!-- 
        ============================================================
        4. ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ (TOAST)
        ============================================================
        Отображается в правом нижнем углу экрана.
        Используется для показа сообщений об успехе или ошибке.
        id="toast" — JS находит его и меняет текст.
        class="toast" — стили (позиция, фон, тень, анимация).
    -->
    <!-- ============================================================
    МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ
    ============================================================ -->
<div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="closeModalBtn" class="modal-close">&times;</span>
        <h3 id="editModalTitle">✏️ Редактирование подписки</h3>
        
        <form id="editForm">
            <!-- Поля для всех -->
            <div class="form-row">
                <div class="form-group">
                    <label>Дата начала</label>
                    <input type="text" id="editStartDate" placeholder="MM-YYYY" required />
                </div>
                <div class="form-group">
                    <label>Дата окончания</label>
                    <input type="text" id="editEndDate" placeholder="MM-YYYY (необяз.)" />
                </div>
            </div>

            <!-- Блок для админа (скрыт по умолчанию) -->
             <!--
            <div id="adminEditSection" style="display:none; margin-top:16px; border-top:1px solid #e5e7eb; padding-top:16px;">
                <h4 style="margin-bottom:8px;">🛠️ Редактирование шаблона</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>Название сервиса</label>
                        <input type="text" id="editServiceName" placeholder="Название" />
                    </div>
                    <div class="form-group">
                        <label>Цена (₽)</label>
                        <input type="number" id="editPrice" placeholder="Цена" min="0" />
                    </div>
                </div>
            </div>
 -->
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button type="submit" class="btn btn-success">💾 Сохранить</button>
                <button type="button" id="cancelEditModalBtn" class="btn btn-outline">Отмена</button>
            </div>
        </form>
    </div>
</div>    
    <div id="toast" class="toast"></div>

    <!-- 
        ============================================================
        5. ПОДКЛЮЧЕНИЕ JAVASCRIPT МОДУЛЕЙ
        ============================================================
        <script type="module"> — позволяет использовать import/export.
        Порядок важен: сначала утилиты, потом API, потом логика.
        ============================================================
    -->

    <!-- Утилиты: вспомогательные функции (showToast, валидация) -->
    <script type="module" src="/js/utils.js"></script>

    <!-- API: работа с сервером (отправка запросов) -->
    <script type="module" src="/js/api.js"></script>

    <!-- Авторизация: вход, выход, JWT, роли -->
    <script type="module" src="/js/auth.js"></script>

    <!-- Компоненты: отрисовка таблицы, пагинация -->
    <script type="module" src="/js/components.js"></script>

    <!-- Главный модуль: связывает всё вместе, обрабатывает события -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
