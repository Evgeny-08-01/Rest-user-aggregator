<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📋 Управление шаблонами</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="app" class="container">
        <header class="header">
            <h1>📋 Управление шаблонами</h1>
            <div id="userInfo" class="user-info">
                <span id="userNameDisplay">Гость</span>
                <span id="userRoleDisplay" class="badge">user</span>
                <button id="logoutBtn" class="btn btn-outline btn-sm">Выйти</button>
                <button id="backBtn" class="btn btn-outline btn-sm">← Назад</button>
            </div>
        </header>

        <div id="mainApp">
            <!-- Форма создания/редактирования -->
            <div class="card">
                <h3 id="formTitle">➕ Новый шаблон</h3>
                <form id="templateForm" class="form-row">
                    <div class="form-group">
                        <label>Название сервиса</label>
                        <input type="text" id="serviceName" placeholder="Яндекс Плюс" required />
                    </div>
                    <div class="form-group">
                        <label>Цена (₽)</label>
                        <input type="number" id="price" placeholder="400" required min="0" />
                    </div>
                    <button type="submit" class="btn btn-success">💾 Сохранить</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display:none;">Отмена</button>
                </form>
            </div>

            <!-- Список шаблонов -->
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                    <h3>📋 Шаблоны</h3>
                    <button id="refreshBtn" class="btn btn-outline">🔄 Обновить</button>
                </div>
                <div id="listContainer">Загрузка...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="/js/utils.js"></script>
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/templates.js"></script>
</body>
</html>
