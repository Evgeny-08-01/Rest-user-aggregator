// ============================================================
// 1. ОБЪЯВЛЕНИЕ ВЕРСИИ ПРОТОКОЛА
// ============================================================
// proto3 — это язык описания данных, который понимают все языки программирования.
// Он не зависит от Go, Kotlin, Java, Python, C++ и т.д.
// 
// proto2 — старая версия, proto3 — текущая (используется везде).
// Разница: в proto3 все поля опциональны по умолчанию, в proto2 нужно явно указывать.
//
// !!! ВАЖНО: эту строку НЕЛЬЗЯ менять — она определяет синтаксис, который будет использоваться.
syntax = "proto3";

// ============================================================
// 2. ПАКЕТ (пространство имён)
// ============================================================
// Пакет — это как namespace в других языках.
// Он нужен, чтобы избежать конфликтов, если в проекте будет несколько .proto-файлов.
//
// Например, если у нас будет ещё один сервис для "Пользователей" — его пакет будет user.
// Тогда subscription.Subscription и user.Subscription — это разные типы.
//
// !!! ВАЖНО: пакет используется в сгенерированном коде как префикс для типов.
package subscription;

// ============================================================
// 3. ОПЦИЯ go_package
// ============================================================
// Указывает, в какой пакет Go сгенерировать код.
// 
// go_package = "proto/subscription" означает:
//   - Все сгенерированные файлы будут лежать в папке proto/subscription/
//   - В Go-коде они будут импортироваться как: import "proto/subscription"
//
// Путь считается ОТ КОРНЯ ПРОЕКТА (там, где лежит go.mod).
// 
// !!! ВАЖНО: если путь не совпадает с реальной структурой папок — код не соберётся.
// В нашем проекте файл лежит в proto/subscription.proto, а сгенерированный код будет
// в proto/subscription/*.go — всё правильно.
option go_package = "proto/subscription";

// ============================================================
// 4. ПУСТОЕ СООБЩЕНИЕ (Empty)
// ============================================================
// В gRPC каждый метод должен принимать и возвращать какое-то сообщение.
// Но иногда нужно вернуть "ничего" (например, при успешном удалении).
//
// Empty — это "пустышка". В нём нет полей, только заголовок.
// Используется для методов, которые не возвращают данных, но должны что-то вернуть,
// чтобы удовлетворить синтаксис gRPC.
//
// Аналог в REST: HTTP 204 No Content.
message Empty {}

// ============================================================
// 5. СЕРВИС (главная часть — список всех RPC-методов)
// ============================================================
// Service — это интерфейс. Он описывает ВСЕ методы API, которые будут доступны
// через gRPC.
//
// Каждый rpc — это один метод.
// Формат: rpc <ИмяМетода> (Запрос) returns (Ответ);
//
// Имена методов должны быть глаголами (Create, Get, List, Update, Delete).
// Это общепринятое соглашение для gRPC.
//
// !!! ВАЖНО: методы делятся на 2 группы по смыслу:
//   1. Работа с ПОДПИСКАМИ (CRUD) — для пользователей
//   2. Работа с ШАБЛОНАМИ (CRUD) — для администраторов
//
// Разделение такое же, как в REST-эндпоинтах:
//   GET/POST /api/subscriptions      → работа с подписками
//   GET/POST /api/admin/templates    → работа с шаблонами (только админ)
service SubscriptionService {
  
  // ============================================================
  // 5.1. МЕТОДЫ ДЛЯ ПОДПИСОК (аналог REST-эндпоинтов /api/subscriptions)
  // ============================================================
  
  // --- GET /api/subscriptions ---
  // Получить список всех подписок (с пагинацией).
  // На вход: limit (сколько записей), offset (сдвиг от начала).
  // На выход: список подписок (SubscriptionList).
  //
  // В REST это выглядит так:
  //   GET /api/subscriptions?limit=10&offset=0
  rpc GetSubscriptions (GetSubscriptionsRequest) returns (SubscriptionList);

  // --- POST /api/subscriptions ---
  // Создать новую подписку.
  // На вход: template_id, user_id, start_date, end_date.
  // На выход: ID созданной подписки.
  //
  // В REST это выглядит так:
  //   POST /api/subscriptions
  //   Body: { "template_id": 1, "user_id": "...", "start_date": "08-2025", "end_date": "..." }
  rpc CreateSubscription (CreateRequest) returns (CreateResponse);

  // --- GET /api/subscriptions/{id} ---
  // Получить одну подписку по её ID.
  // На вход: id.
  // На выход: полная запись подписки (Subscription).
  //
  // В REST это выглядит так:
  //   GET /api/subscriptions/5
  rpc GetSubscription (GetRequest) returns (Subscription);

  // --- PUT /api/subscriptions/{id} ---
  // Обновить существующую подписку.
  // На вход: id + новые поля.
  // На выход: ничего (Empty), только статус успеха.
  //
  // В REST это выглядит так:
  //   PUT /api/subscriptions/5
  //   Body: { "template_id": 2, "user_id": "...", "start_date": "09-2025", ... }
  rpc UpdateSubscription (UpdateRequest) returns (Empty);

  // --- DELETE /api/subscriptions/{id} ---
  // Удалить подписку по ID.
  // На вход: id.
  // На выход: ничего (Empty).
  //
  // В REST это выглядит так:
  //   DELETE /api/subscriptions/5
  rpc DeleteSubscription (GetRequest) returns (Empty);

  // --- GET /api/subscriptions/total-cost ---
  // Рассчитать суммарную стоимость подписок за период.
  // На вход: user_id, service_name (опционально), start_date, end_date.
  // На выход: total (число).
  //
  // В REST это выглядит так:
  //   GET /api/subscriptions/total-cost?user_id=...&start_date=01-2025&end_date=12-2025
  rpc GetTotalCost (TotalCostRequest) returns (TotalCostResponse);

  // ============================================================
  // 5.2. МЕТОДЫ ДЛЯ ШАБЛОНОВ (аналог REST-эндпоинтов /api/admin/templates)
  // ============================================================
  // Эти методы должны быть доступны ТОЛЬКО администраторам.
  // На уровне gRPC мы будем проверять роль через interceptor (authMiddleware).
  
  // --- GET /api/templates ---
  // Получить список всех шаблонов (доступно всем авторизованным пользователям).
  // На вход: ничего (Empty).
  // На выход: список шаблонов (TemplateList).
  rpc ListTemplates (Empty) returns (TemplateList);

  // --- GET /api/templates/{id} ---
  // Получить шаблон по ID.
  // На вход: id.
  // На выход: полная запись шаблона (Template).
  rpc GetTemplate (GetRequest) returns (Template);

  // --- POST /api/admin/templates ---
  // Создать новый шаблон (только админ).
  // На вход: service_name, price.
  // На выход: ID созданного шаблона.
  rpc CreateTemplate (CreateTemplateRequest) returns (CreateResponse);

  // --- PUT /api/admin/templates/{id} ---
  // Обновить шаблон (только админ).
  // На вход: id + service_name, price.
  // На выход: ничего (Empty).
  rpc UpdateTemplate (UpdateTemplateRequest) returns (Empty);

  // --- DELETE /api/admin/templates/{id} ---
  // Удалить шаблон (только админ).
  // На вход: id.
  // На выход: ничего (Empty).
  rpc DeleteTemplate (GetRequest) returns (Empty);
}

// ============================================================
// 6. СООБЩЕНИЯ (структуры данных)
// ============================================================
// Сообщения — это структуры с полями. Они используются в запросах и ответах.
//
// Формат: 
//   message Имя { 
//     тип имя_поля = номер_поля; 
//   }
//
// Номера полей (1, 2, 3, ...) нужны для бинарной сериализации.
// Они должны быть уникальными внутри сообщения.
// Номера 1-15 занимают 1 байт, 16+ занимают 2 байта — поэтому важные поля имеют малые номера.

// ============================================================
// 6.1. ПОДПИСКИ
// ============================================================

// Subscription — полное описание одной подписки.
// Совпадает с models.Subscription в Go и Subscription в Kotlin.
message Subscription {
  int32  id           = 1;  // ID подписки (генерируется БД)
  string service_name = 2;  // Название сервиса (из шаблона)
  int32  price        = 3;  // Цена (из шаблона)
  string user_id      = 4;  // UUID пользователя
  string start_date   = 5;  // Дата начала (MM-YYYY)
  string end_date     = 6;  // Дата окончания (MM-YYYY), может быть пустой
}

// SubscriptionList — список подписок.
// Используется как ответ на GetSubscriptions.
message SubscriptionList {
  repeated Subscription subscriptions = 1;  // repeated = массив (в Go это []Subscription)
}

// CreateRequest — запрос на создание подписки.
// Отличается от Subscription тем, что ID не передаётся (генерируется БД).
message CreateRequest {
  int32  template_id = 1;   // ID шаблона (обязательно)
  string user_id     = 2;   // UUID пользователя (берётся из JWT)
  string start_date  = 3;   // Дата начала (обязательно, MM-YYYY)
  string end_date    = 4;   // Дата окончания (опционально, MM-YYYY)
}

// UpdateRequest — запрос на обновление подписки.
message UpdateRequest {
  int32  id          = 1;   // ID подписки (обязательно)
  int32  template_id = 2;   // Новый ID шаблона
  string user_id     = 3;   // UUID пользователя
  string start_date  = 4;   // Новая дата начала
  string end_date    = 5;   // Новая дата окончания
}

// GetRequest — запрос по ID (используется в GetSubscription и DeleteSubscription).
message GetRequest {
  int32 id = 1;
}

// CreateResponse — ответ на создание (возвращает ID).
message CreateResponse {
  int32 id = 1;   // ID созданной записи
}

// GetSubscriptionsRequest — запрос на список подписок с пагинацией.
message GetSubscriptionsRequest {
  int32 limit  = 1;   // Сколько записей вернуть (по умолчанию 20)
  int32 offset = 2;   // Сдвиг от начала (по умолчанию 0)
}

// TotalCostRequest — запрос на расчёт суммы.
message TotalCostRequest {
  string user_id      = 1;   // ID пользователя (опционально, если пусто — все)
  string service_name = 2;   // Название сервиса (опционально, если пусто — все)
  string start_date   = 3;   // Дата начала (обязательно, MM-YYYY)
  string end_date     = 4;   // Дата окончания (обязательно, MM-YYYY)
}

// TotalCostResponse — ответ с суммой.
message TotalCostResponse {
  int32 total = 1;   // Суммарная стоимость в рублях
}

// ============================================================
// 6.2. ШАБЛОНЫ
// ============================================================

// Template — шаблон подписки.
message Template {
  int32  id           = 1;   // ID шаблона
  string service_name = 2;   // Название сервиса
  int32  price        = 3;   // Цена (в рублях)
}

// TemplateList — список шаблонов.
message TemplateList {
  repeated Template templates = 1;
}

// CreateTemplateRequest — запрос на создание шаблона.
message CreateTemplateRequest {
  string service_name = 1;   // Название (обязательно)
  int32  price        = 2;   // Цена (обязательно, >= 0)
}

// UpdateTemplateRequest — запрос на обновление шаблона.
message UpdateTemplateRequest {
  int32  id           = 1;   // ID шаблона (обязательно)
  string service_name = 2;   // Новое название
  int32  price        = 3;   // Новая цена
}